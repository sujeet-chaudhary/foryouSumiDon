<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A question for you</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="blush" id="blush" aria-hidden="true"></div>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <main class="stage">
    <!-- Scene 1: sealed letter -->
    <section class="scene is-active" id="scene-seal">
      <p class="small" id="forLine">A letter for you</p>
      <button class="seal" id="sealBtn" aria-label="Open the letter">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.8 6.6 4.8c2 0 3.8 1.1 5.4 3 1.6-1.9 3.4-3 5.4-3 3.6 0 5.7 3.6 4.2 7C19.5 16.4 12 21 12 21z"/></svg>
      </button>
      <p class="small">Tap the seal to open</p>
    </section>

    <!-- Scene 2: the letter, one line at a time -->
    <section class="scene" id="scene-letter">
      <p class="line" id="letterLine" aria-live="polite"></p>
      <button class="btn btn-soft" id="nextBtn">Keep reading</button>
    </section>

    <!-- Scene 3: the question -->
    <section class="scene" id="scene-ask">
      <h1 class="question" id="question"></h1>
      <p class="tease" id="tease" aria-live="polite"></p>
      <div class="choices" id="choices">
        <button class="btn btn-yes" id="yesBtn">Yes</button>
        <button class="btn btn-no" id="noBtn">No</button>
      </div>
    </section>

    <!-- Scene 4: she said yes -->
    <section class="scene" id="scene-yes">
      <h1 class="question" id="yesTitle"></h1>
      <p class="line" id="yesText"></p>
      <p class="small" id="signoff"></p>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
